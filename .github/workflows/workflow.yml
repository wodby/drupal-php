name: Build docker image

on:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

# Runs of one event and branch or tag never overlap, so an older master run
# cannot finish last and move floating tags back. A newer pending run of the
# same event replaces an older one; other events never replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE_REVISION: r16

jobs:
  build:
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3', '8.2' ]
        arch:
          - amd64
          - arm64
        variant:
          - { dev: '', dev_macos: '' }
          - { dev: 'dev', dev_macos: '' }
          - { dev: '', dev_macos: 'dev-macos' }
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        env:
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
          PHP_DEV: ${{ matrix.variant.dev }}
          PHP_DEV_MACOS: ${{ matrix.variant.dev_macos }}
        run: |
          make
          make test
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve architecture image
        id: arch-image
        if: github.event_name == 'push'
        env:
          PHP_VER: ${{ matrix.php }}
          ARCH: ${{ matrix.arch }}
          PHP_DEV: ${{ matrix.variant.dev }}
          PHP_DEV_MACOS: ${{ matrix.variant.dev_macos }}
        run: echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Push architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.arch-image.outputs.image }}

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      matrix:
        php: [ '8.5', '8.4', '8.3', '8.2' ]
        variant:
          - { dev: '', dev_macos: '' }
          - { dev: 'dev', dev_macos: '' }
          - { dev: '', dev_macos: 'dev-macos' }
        include:
          - php: '8.5'
            latest: 'latest'
            latest_major: '8'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ matrix.php }}
          dev: ${{ matrix.variant.dev }}
          dev_macos: ${{ matrix.variant.dev_macos }}
          latest: ${{ matrix.latest }}
          latest_major: ${{ matrix.latest_major }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
